<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sors Meeting Voice Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        :root { --bg-dark:#1a1a2e; --bg-card:#16213e; --text-primary:#e0e0e0; --border-color:#2a2a4a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg-dark); color:var(--text-primary); font-family:'Segoe UI',sans-serif; min-height:100vh; }
        .app-container { max-width:800px; margin:0 auto; padding:20px 15px; }
        /* Hide the entire UI when hidden-mode is applied */
        .app-container.hidden-mode { display:none; }
        .glass-card { background:var(--bg-card); border-radius:20px; border:1px solid var(--border-color); padding:25px; margin-bottom:20px; }
        .app-header { text-align:center; margin-bottom:25px; }
        .app-header h1 { font-size:1.8rem; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .status-indicator { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:15px; }
        .status-dot { width:12px; height:12px; border-radius:50%; background:#555; }
        .status-dot.recording { background:#f5576c; animation:pulse 1.5s infinite; }
        .status-dot.processing { background:#fbbf24; animation:pulse 1s infinite; }
        .status-dot.idle { background:#4ade80; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(245,87,108,.6)} 50%{box-shadow:0 0 0 12px rgba(245,87,108,0)} }
        .btn-toggle { width:120px; height:120px; border-radius:50%; border:none; font-size:2.5rem; cursor:pointer; transition:.3s; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 8px 30px rgba(0,0,0,.3); }
        .btn-toggle.start { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
        .btn-toggle.stop { background:linear-gradient(135deg,#f093fb,#f5576c); color:#fff; }
        .btn-toggle:disabled { opacity:0.6; cursor:not-allowed; }
        .btn-toggle .btn-label { font-size:.75rem; letter-spacing:2px; text-transform:uppercase; font-weight:600; }
        .btn-toggle .btn-icon { font-size:2.2rem; line-height:1; }
        .form-select, .form-input { background:#1e2a4a; border:1px solid var(--border-color); color:var(--text-primary); border-radius:10px; padding:10px 15px; font-size:.9rem; width:100%; }
        .text-area { background:#0f1a3a; border:1px solid var(--border-color); border-radius:12px; color:var(--text-primary); padding:15px; width:100%; min-height:120px; resize:vertical; }
        #answerArea { min-height:240px; } /* double the default height */
        .btn-action { border-radius:10px; padding:8px 16px; font-size:.85rem; font-weight:600; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
        .btn-copy { background:rgba(102,126,234,.2); color:#667eea; border:1px solid rgba(102,126,234,.3); }
        .btn-settings { background:rgba(255,255,255,.05); color:#a0a0b0; border:1px solid var(--border-color); }
        .btn-hide { background:rgba(245,87,108,.15); color:#f5576c; border:1px solid rgba(245,87,108,.3); }
        .btn-clear { background:rgba(255,255,255,.05); color:#a0a0b0; border:1px solid var(--border-color); }
        .floating-btn { position:fixed; bottom:30px; right:30px; width:55px; height:55px; border-radius:50%; background:linear-gradient(135deg,#667eea,#764ba2); border:none; color:#fff; font-size:1.5rem; cursor:pointer; z-index:99999; display:none; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(102,126,234,.5); opacity:.7; }
        .floating-btn.active { display:flex; }
        .settings-panel { background:#0f1a3a; border-radius:12px; padding:15px; margin-top:10px; border:1px solid var(--border-color); display:none; }
        .settings-panel.show { display:block; }
        .alert-custom { padding:10px 15px; border-radius:10px; font-size:.85rem; margin-top:10px; display:none; }
        .alert-custom.show { display:block; }
        .alert-info-custom { background:rgba(102,126,234,.15); border:1px solid rgba(102,126,234,.3); color:#a5b4fc; }
        .alert-error-custom { background:rgba(245,87,108,.15); border:1px solid rgba(245,87,108,.3); color:#fca5a5; }
        .debug-console { background:#000; color:#0f0; font-family:monospace; font-size:12px; max-height:150px; overflow-y:auto; padding:10px; border-radius:8px; margin-top:10px; white-space:pre-wrap; display:none; }
        .debug-console.show { display:block; }
        .badge-language { padding:3px 8px; border-radius:6px; font-size:.7rem; font-weight:600; background:rgba(102,126,234,.2); color:#a5b4fc; }
        .form-check { display:flex; align-items:center; gap:10px; }
        .form-check-input { width:20px; height:20px; cursor:pointer; }
        .hidden-btn { display:none; }
        .debug-header { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
    </style>
</head>
<body>
    <button class="floating-btn" id="floatingRestoreBtn"><i class="bi bi-mic-fill"></i></button>

    <div class="app-container" id="appContainer">
        <div class="app-header">
            <div class="logo-icon" style="font-size:3rem;"><i class="bi bi-mic-fill"></i></div>
            <h1>Sors Meeting Voice Assistant</h1>
            <p class="subtitle" style="color:#a0a0b0;">Multi-provider with Bulgarian language</p>
        </div>

        <div class="glass-card">
            <div class="status-indicator">
                <span class="status-dot idle" id="statusDot"></span>
                <span class="status-text" id="statusText">Ready</span>
                <span class="badge-language" id="currentLangBadge">en-US</span>
            </div>
            <div class="toggle-btn-wrapper text-center">
                <button class="btn-toggle start" id="toggleBtn">
                    <span class="btn-icon"><i class="bi bi-mic"></i></span>
                    <span class="btn-label">Start</span>
                </button>
            </div>
            <div class="row mt-3">
                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-translate"></i> Language</label>
                    <select class="form-select" id="languageSelect"></select>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <button class="btn-action btn-clear w-100" id="clearAllBtn"><i class="bi bi-trash3"></i> Clear</button>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <div class="d-flex justify-content-between mb-2">
                <label class="form-label mb-0"><i class="bi bi-chat-square-text"></i> Transcription (editable)</label>
                <button class="btn-action btn-copy hidden-btn" id="copyTranscriptionBtn"><i class="bi bi-clipboard"></i> Copy</button>
            </div>
            <textarea class="text-area" id="transcriptionArea" placeholder="Your speech appears here, you can edit before sending..."></textarea>
            <div class="alert-custom alert-info-custom" id="micWarning"><i class="bi bi-info-circle"></i> Mic active simultaneously.</div>
        </div>

        <div class="glass-card">
            <div class="d-flex justify-content-between mb-2">
                <label class="form-label mb-0"><i class="bi bi-robot"></i> AI Answer</label>
                <div class="d-flex gap-2">
                    <button class="btn-action btn-copy hidden-btn" id="copyAnswerBtn"><i class="bi bi-clipboard"></i> Copy</button>
                    <button class="btn-action btn-settings" id="settingsToggleBtn"><i class="bi bi-gear"></i> Settings</button>
                    <button class="btn-action btn-clear" id="testAIBtn"><i class="bi bi-lightning"></i> Send</button>
                    <button class="btn-action btn-clear hidden-btn" id="testProxyBtn"><i class="bi bi-wifi"></i> Test Proxy</button>
                </div>
            </div>
            <textarea class="text-area" id="answerArea" readonly></textarea>

            <div class="settings-panel" id="settingsPanel">
                <h6 class="text-secondary mb-3">AI API Configuration</h6>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">API Provider</label>
                        <select class="form-select" id="apiProvider">
                            <option value="huggingface" selected>Hugging Face</option>
                            <option value="pollinations">Pollinations</option>
                            <option value="ollama">Ollama</option>
                            <option value="openai">OpenAI Compatible</option>
                            <option value="gemini">Google Gemini</option>
                            <option value="grok">Grok (xAI)</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="copilot">Microsoft Copilot</option>
                            <option value="nvidia">NVIDIA AI</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">API URL (editable)</label>
                        <input type="text" class="form-input" id="apiUrlInput" placeholder="Auto-filled based on provider">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">API Token</label>
                        <input type="password" class="form-input" id="apiToken" placeholder="Optional">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Model</label>
                        <input type="text" class="form-input" id="apiModel" value="google/flan-t5-large" placeholder="Model name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Prompt Key</label>
                        <input type="text" class="form-input" id="promptKeyInput" value="prompt" placeholder="Key for prompt in request body">
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="proxyToggle" checked>
                            <label class="form-check-label" for="proxyToggle">Use proxies if direct fetch fails</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <small class="text-secondary">For Ollama, default URL is http://localhost:11434/api/generate. For others, defaults are pre-filled but editable.</small>
                        <button class="btn-action btn-clear" id="openCorsDemoBtn" title="Request temporary access to CORS Anywhere proxy">
                            <i class="bi bi-box-arrow-up-right"></i> Open CORS Proxy Access
                        </button>
                    </div>
                    <!-- Export / Import Settings -->
                    <div class="col-12 mt-3 border-top pt-3">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <button class="btn-action btn-clear w-100" id="exportSettingsBtn"><i class="bi bi-download"></i> Export Settings</button>
                            </div>
                            <div class="col-md-6">
                                <button class="btn-action btn-clear w-100" id="importSettingsBtn"><i class="bi bi-upload"></i> Import Settings</button>
                                <input type="file" id="importSettingsFile" accept=".config" style="display:none;" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="alert-custom alert-error-custom" id="errorAlert"></div>
            <div class="debug-header">
                <small class="text-secondary">Debug Log</small>
                <button class="btn-action btn-clear" id="clearLogBtn"><i class="bi bi-trash3"></i> Clear Log</button>
            </div>
            <div class="debug-console" id="debugConsole"></div>
        </div>

        <div class="glass-card text-center">
            <button class="btn-action btn-hide" id="hideBtn"><i class="bi bi-eye-slash"></i> Hide</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // ========== DEBUG ==========
            function debugLog(msg) {
                console.log('[DEBUG]', msg);
                $('#debugConsole').addClass('show').append(`[${new Date().toLocaleTimeString()}] ${msg}\n`);
                $('#debugConsole').scrollTop($('#debugConsole')[0].scrollHeight);
            }
            function showAlert(msg) { alert(msg); }
            function showError(msg) {
                $('#errorAlert').html(`<i class="bi bi-exclamation-triangle"></i> ${msg}`).addClass('show');
                debugLog('ERROR: ' + msg);
                showAlert(msg);
            }
            function hideError() { $('#errorAlert').removeClass('show'); }

            // ========== LANGUAGES (Bulgarian added) ==========
            const LANGUAGES = [
                { code:'en-US', name:'English (US)' },
                { code:'en-GB', name:'English (UK)' },
                { code:'bg-BG', name:'Bulgarian' },
                { code:'es-ES', name:'Spanish' },
                { code:'fr-FR', name:'French' },
                { code:'de-DE', name:'German' },
                { code:'it-IT', name:'Italian' },
                { code:'pt-BR', name:'Portuguese (Brazil)' },
                { code:'pt-PT', name:'Portuguese (Portugal)' },
                { code:'ru-RU', name:'Russian' },
                { code:'zh-CN', name:'Chinese (Simplified)' },
                { code:'zh-TW', name:'Chinese (Traditional)' },
                { code:'ja-JP', name:'Japanese' },
                { code:'ko-KR', name:'Korean' },
                { code:'ar-SA', name:'Arabic (Saudi Arabia)' },
                { code:'ar-EG', name:'Arabic (Egypt)' },
                { code:'hi-IN', name:'Hindi' },
                { code:'nl-NL', name:'Dutch' },
                { code:'pl-PL', name:'Polish' },
                { code:'tr-TR', name:'Turkish' },
                { code:'vi-VN', name:'Vietnamese' },
                { code:'th-TH', name:'Thai' },
                { code:'sv-SE', name:'Swedish' },
                { code:'da-DK', name:'Danish' },
                { code:'nb-NO', name:'Norwegian' },
                { code:'fi-FI', name:'Finnish' },
                { code:'el-GR', name:'Greek' },
                { code:'cs-CZ', name:'Czech' },
                { code:'ro-RO', name:'Romanian' },
                { code:'he-IL', name:'Hebrew' },
                { code:'id-ID', name:'Indonesian' },
                { code:'ms-MY', name:'Malay' },
                { code:'uk-UA', name:'Ukrainian' },
                { code:'hu-HU', name:'Hungarian' },
                { code:'sk-SK', name:'Slovak' },
                { code:'hr-HR', name:'Croatian' },
                { code:'ca-ES', name:'Catalan' },
                { code:'lt-LT', name:'Lithuanian' },
                { code:'sl-SI', name:'Slovenian' },
                { code:'et-EE', name:'Estonian' },
                { code:'lv-LV', name:'Latvian' },
                { code:'is-IS', name:'Icelandic' },
                { code:'fa-IR', name:'Persian (Farsi)' },
                { code:'ur-PK', name:'Urdu' },
                { code:'bn-IN', name:'Bengali' },
                { code:'ta-IN', name:'Tamil' },
                { code:'te-IN', name:'Telugu' },
                { code:'mr-IN', name:'Marathi' },
                { code:'gu-IN', name:'Gujarati' },
                { code:'kn-IN', name:'Kannada' },
                { code:'ml-IN', name:'Malayalam' },
                { code:'pa-IN', name:'Punjabi' },
                { code:'fil-PH', name:'Filipino' }
            ];
            LANGUAGES.forEach(l => $('#languageSelect').append($('<option>',{value:l.code,text:`${l.name} (${l.code})`})));
            $('#languageSelect').val('en-US');

            // ========== STATE ==========
            let isRecording = false;
            let recognition = null;
            let selectedLanguage = 'en-US';
            let isHidden = false;
            let isProcessingAI = false;

            const $toggleBtn = $('#toggleBtn');
            const $statusDot = $('#statusDot');
            const $statusText = $('#statusText');
            const $transcriptionArea = $('#transcriptionArea');
            const $answerArea = $('#answerArea');
            const $apiProvider = $('#apiProvider');
            const $apiUrlInput = $('#apiUrlInput');
            const $apiToken = $('#apiToken');
            const $apiModel = $('#apiModel');
            const $promptKeyInput = $('#promptKeyInput');
            const $proxyToggle = $('#proxyToggle');
            const $settingsPanel = $('#settingsPanel');
            const $settingsToggleBtn = $('#settingsToggleBtn');
            const $hideBtn = $('#hideBtn');
            const $floatingRestoreBtn = $('#floatingRestoreBtn');
            const $appContainer = $('#appContainer');
            const $clearAllBtn = $('#clearAllBtn');
            const $copyTranscriptionBtn = $('#copyTranscriptionBtn');
            const $copyAnswerBtn = $('#copyAnswerBtn');
            const $testAIBtn = $('#testAIBtn');
            const $testProxyBtn = $('#testProxyBtn');
            const $openCorsDemoBtn = $('#openCorsDemoBtn');
            const $exportSettingsBtn = $('#exportSettingsBtn');
            const $importSettingsBtn = $('#importSettingsBtn');
            const $importSettingsFile = $('#importSettingsFile');
            const $clearLogBtn = $('#clearLogBtn');
            const $debugConsole = $('#debugConsole');

            // ========== PROVIDER DEFAULTS ==========
            const PROVIDER_DEFAULTS = {
                huggingface: { url:'https://api-inference.huggingface.co/models/', model:'google/flan-t5-large', promptKey:'inputs', requiresToken:true, style:'huggingface' },
                pollinations: { url:'https://text.pollinations.ai/', model:'openai', promptKey:'prompt', requiresToken:false, style:'pollinations' },
                ollama: { url:'http://localhost:11434/api/generate', model:'llama3', promptKey:'prompt', requiresToken:false, style:'ollama' },
                openai: { url:'https://api.openai.com/v1/chat/completions', model:'gpt-3.5-turbo', promptKey:'messages', requiresToken:true, style:'openai' },
                gemini: { url:'https://generativelanguage.googleapis.com/v1beta/models/', model:'gemini-pro', promptKey:'contents', requiresToken:true, style:'gemini' },
                grok: { url:'https://api.x.ai/v1/chat/completions', model:'grok-2-1212', promptKey:'messages', requiresToken:true, style:'openai' },
                deepseek: { url:'https://api.deepseek.com/chat/completions', model:'deepseek-chat', promptKey:'messages', requiresToken:true, style:'openai' },
                copilot: { url:'https://api.githubcopilot.com/chat/completions', model:'copilot', promptKey:'messages', requiresToken:true, style:'openai' },
                nvidia: { url:'https://integrate.api.nvidia.com/v1/chat/completions', model:'meta/llama3-8b-instruct', promptKey:'messages', requiresToken:true, style:'openai' },
                custom: { url:'', model:'', promptKey:'prompt', requiresToken:false, style:'custom' }
            };

            function updateProviderFields() {
                const provider = $apiProvider.val();
                const defaults = PROVIDER_DEFAULTS[provider];
                if (!defaults) return;
                $apiUrlInput.val(defaults.url);
                $apiModel.val(defaults.model);
                $promptKeyInput.val(defaults.promptKey);
                $apiToken.prop('placeholder', defaults.requiresToken ? 'Required for this provider' : 'Optional');
                debugLog(`Provider changed to ${provider}. Set default URL: ${defaults.url}, Model: ${defaults.model}, Prompt Key: ${defaults.promptKey}`);
            }
            $apiProvider.on('change', updateProviderFields);
            updateProviderFields();

            function updateStatus(dotClass, text) {
                $statusDot.removeClass('recording processing idle').addClass(dotClass);
                $statusText.text(text);
            }

            // ========== SPEECH (unchanged) ==========
            function isSpeechSupported() { return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window; }

            function startRecording() {
                if (isProcessingAI) {
                    showAlert('AI is still processing, please wait for the answer.');
                    return;
                }
                if (!isSpeechSupported()) { showError('Speech not supported'); return; }
                if (isRecording) return;
                isRecording = true;
                $transcriptionArea.val('');
                hideError();
                try {
                    recognition = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
                    recognition.continuous = false;
                    recognition.interimResults = true;
                    recognition.lang = selectedLanguage;
                    recognition.onresult = e => {
                        let finalText = '';
                        let interimText = '';
                        for (let i = 0; i < e.results.length; i++) {
                            const res = e.results[i];
                            if (res.isFinal) finalText += res[0].transcript + ' ';
                            else interimText += res[0].transcript;
                        }
                        $transcriptionArea.val((finalText + interimText).trim());
                        debugLog('Speech: ' + $transcriptionArea.val());
                    };
                    recognition.onerror = e => { debugLog('Speech error: '+e.error); if(e.error==='not-allowed') showError('Mic denied'); };
                    recognition.onend = () => {
                        debugLog('Speech recognition ended.');
                        if (isRecording) {
                            isRecording = false;
                            recognition = null;
                            $toggleBtn.removeClass('stop').addClass('start');
                            $toggleBtn.find('.btn-label').text('Start');
                            $toggleBtn.find('.btn-icon').html('<i class="bi bi-mic"></i>');
                            updateStatus('processing', 'Processing...');
                            const q = $transcriptionArea.val().trim();
                            debugLog('Auto-send after end event. Text: "' + q + '"');
                            if (q) sendToAI(q);
                            else updateStatus('idle', 'No text transcribed');
                        }
                    };
                    recognition.start();
                } catch(e) {
                    showError('Recognition start failed: '+e.message);
                    isRecording=false;
                    return;
                }
                $toggleBtn.removeClass('start').addClass('stop');
                $toggleBtn.find('.btn-label').text('Stop & Ask AI');
                $toggleBtn.find('.btn-icon').html('<i class="bi bi-stop-fill"></i>');
                updateStatus('recording','Recording...');
                debugLog('Recording started');
            }

            function stopRecording(sendToAI=true) {
                if (!isRecording && !recognition) return;
                debugLog('Manual stop.');
                isRecording=false;
                if (recognition) { try{recognition.stop()}catch(e){} recognition=null; }
                $toggleBtn.removeClass('stop').addClass('start');
                $toggleBtn.find('.btn-label').text('Start');
                $toggleBtn.find('.btn-icon').html('<i class="bi bi-mic"></i>');
                updateStatus('processing','Processing...');
                const q = $transcriptionArea.val().trim();
                debugLog('Text: "'+q+'"');
                if (sendToAI && q) sendToAI(q);
                else if (sendToAI) updateStatus('idle','No text');
                else updateStatus('idle','Ready');
            }

            // ========== CORS PROXIES ==========
            const PROXY_LIST = [
                { name:'corsproxy.io', build: url => 'https://corsproxy.io/?url=' + encodeURIComponent(url) },
                { name:'allorigins', build: url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url) },
                { name:'codetabs', build: url => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url) },
                { name:'cors.eu.org', build: url => 'https://cors.eu.org/' + url },
                { name:'thingproxy', build: url => 'https://thingproxy.freeboard.io/fetch/' + url }
            ];

            // ========== SEND TO AI ==========
            function sendToAI(question) {
                debugLog('=== sendToAI START ===');
                debugLog('Question passed: "' + question + '"');
                if (isProcessingAI) return;
                isProcessingAI = true;
                $toggleBtn.prop('disabled', true);
                updateStatus('processing','AI generating...');

                const provider = $apiProvider.val();
                const defaults = PROVIDER_DEFAULTS[provider];
                const token = $apiToken.val().trim();
                const model = $apiModel.val().trim();
                const customUrl = $apiUrlInput.val().trim();
                const promptKey = $promptKeyInput.val().trim() || defaults.promptKey;
                const useProxies = $proxyToggle.is(':checked');

                debugLog(`Provider: ${provider}, Model: ${model}, Use Proxies: ${useProxies}`);

                if (defaults.requiresToken && !token) {
                    showError(`API token required for ${provider}. Enter token in settings.`);
                    finishProcessing();
                    return;
                }
                if ((provider === 'ollama' || provider === 'custom') && !customUrl) {
                    showError('API URL is required for this provider.');
                    finishProcessing();
                    return;
                }

                $answerArea.val('⏳ Thinking... (15 sec timeout)');

                let apiUrl = customUrl;
                let requestBody = null;
                let headers = {'Content-Type':'application/json'};
                let method = 'POST';

                if (defaults.style === 'huggingface') {
                    if (!apiUrl.endsWith(model) && !apiUrl.includes('/models/')) {
                        apiUrl = apiUrl + model;
                    } else if (!apiUrl) {
                        apiUrl = `https://api-inference.huggingface.co/models/${model}`;
                    }
                    headers['Authorization'] = `Bearer ${token}`;
                    requestBody = {
                        inputs: `Question: ${question}\n\nAnswer:`,
                        parameters: { max_new_tokens: 300, temperature: 0.3, top_p: 0.9, do_sample: true, return_full_text: false }
                    };
                } else if (defaults.style === 'pollinations') {
                    apiUrl = `https://text.pollinations.ai/${encodeURIComponent(question)}?model=${model || 'openai'}&max_tokens=300`;
                    headers = {};
                    method = 'GET';
                } else if (defaults.style === 'ollama') {
                    apiUrl = customUrl || 'http://localhost:11434/api/generate';
                    requestBody = { model: model || 'llama3', prompt: question, stream: false };
                    if (token) headers['Authorization'] = `Bearer ${token}`;
                } else if (defaults.style === 'openai') {
                    apiUrl = customUrl || defaults.url;
                    headers['Authorization'] = `Bearer ${token}`;
                    requestBody = {
                        model: model || defaults.model,
                        messages: [{ role: 'user', content: question }],
                        max_tokens: 300,
                        temperature: 0.3
                    };
                } else if (defaults.style === 'gemini') {
                    let base = customUrl;
                    if (!base) base = 'https://generativelanguage.googleapis.com/v1beta/models/';
                    if (!base.endsWith('/')) base += '/';
                    apiUrl = `${base}${model || 'gemini-pro'}:generateContent?key=${token}`;
                    requestBody = { contents: [{ parts: [{ text: question }] }] };
                    headers = {};
                } else if (defaults.style === 'custom') {
                    apiUrl = customUrl;
                    requestBody = { [promptKey]: question };
                    if (token) headers['Authorization'] = `Bearer ${token}`;
                }

                debugLog('API URL: ' + apiUrl);
                debugLog('Method: ' + method);
                debugLog('Headers: ' + JSON.stringify(headers));
                if (requestBody) debugLog('Body: ' + JSON.stringify(requestBody));

                const fetchWithOptions = (url) => {
                    debugLog(`fetch() called for: ${url}`);
                    const opts = { method, headers, signal: AbortSignal.timeout(15000) };
                    if (requestBody) opts.body = JSON.stringify(requestBody);
                    return fetch(url, opts);
                };

                const tryDirect = async () => {
                    debugLog('Attempting direct fetch...');
                    const response = await fetchWithOptions(apiUrl);
                    debugLog('Direct response status: ' + response.status);
                    return response;
                };

                const tryProxies = async () => {
                    debugLog('Starting proxy attempts...');
                    let lastError;
                    for (const proxy of PROXY_LIST) {
                        const proxiedUrl = proxy.build(apiUrl);
                        debugLog(`Trying proxy: ${proxy.name} -> ${proxiedUrl}`);
                        try {
                            const response = await fetchWithOptions(proxiedUrl);
                            debugLog(`Proxy ${proxy.name} status: ${response.status}`);
                            if (response.ok) {
                                const ct = response.headers.get('content-type') || '';
                                debugLog(`Proxy ${proxy.name} content-type: ${ct}`);
                                if (ct.includes('application/json')) return await response.json();
                                else return await response.text();
                            }
                            const text = await response.text();
                            throw new Error(`HTTP ${response.status}: ${text}`);
                        } catch (err) {
                            debugLog(`Proxy ${proxy.name} failed: ${err.message}`);
                            lastError = err;
                        }
                    }
                    throw lastError || new Error('All proxies failed');
                };

                (async () => {
                    let data;
                    try {
                        const directResponse = await tryDirect();
                        if (directResponse.ok) {
                            const ct = directResponse.headers.get('content-type') || '';
                            debugLog('Direct success, parsing...');
                            data = ct.includes('application/json') ? await directResponse.json() : await directResponse.text();
                        } else {
                            debugLog('Direct failed, status: ' + directResponse.status);
                            if (useProxies) data = await tryProxies();
                            else throw new Error(`Direct fetch failed with status ${directResponse.status}`);
                        }
                    } catch (directErr) {
                        debugLog('Direct fetch error: ' + directErr.message);
                        if (useProxies) {
                            try { data = await tryProxies(); }
                            catch (proxyErr) { throw proxyErr; }
                        } else throw directErr;
                    }

                    let answer = '';
                    if (defaults.style === 'huggingface') {
                        if (Array.isArray(data) && data.length > 0) {
                            if (typeof data[0] === 'string') answer = data[0];
                            else if (data[0].generated_text) answer = data[0].generated_text;
                        } else if (typeof data === 'string') answer = data;
                        else if (data.generated_text) answer = data.generated_text;
                        if (answer.includes('Answer:')) answer = answer.split('Answer:').pop().trim();
                    } else if (defaults.style === 'pollinations') {
                        answer = typeof data === 'string' ? data : (data.text || data.response || '');
                    } else if (defaults.style === 'ollama') {
                        answer = data.response || data.text || data.output || JSON.stringify(data);
                    } else if (defaults.style === 'openai') {
                        if (data.choices && data.choices[0] && data.choices[0].message) answer = data.choices[0].message.content;
                        else answer = JSON.stringify(data);
                    } else if (defaults.style === 'gemini') {
                        if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                            answer = data.candidates[0].content.parts.map(p => p.text).join('');
                        } else answer = JSON.stringify(data);
                    } else {
                        answer = typeof data === 'string' ? data : (data.answer || data.response || data.generated_text || data.output || data.text || JSON.stringify(data));
                    }

                    debugLog('Extracted answer: "' + answer + '"');
                    if (answer.trim()) {
                        $answerArea.val(answer.trim());
                        updateStatus('idle','✅ AI ready');
                        debugLog('Answer displayed.');
                    } else {
                        $answerArea.val('⚠️ Empty answer');
                        updateStatus('idle','Empty');
                        debugLog('Empty answer.');
                    }
                    finishProcessing();
                })().catch(finalErr => {
                    debugLog('Final error: ' + finalErr.message);
                    let msg = finalErr.message;
                    if (finalErr.name === 'TimeoutError' || finalErr.name === 'AbortError') msg = 'Timeout (10s)';
                    else if (msg.includes('401')) msg = 'Auth failed. Check token.';
                    else if (msg.includes('402')) msg = 'Payment Required. API key needed.';
                    else if (msg.includes('403')) msg = 'Forbidden. Token may lack permission.';
                    else if (msg.includes('404')) msg = 'Model not found or endpoint wrong.';
                    else if (msg.includes('429')) msg = 'Rate limit. Wait.';
                    else if (msg.includes('503')) msg = 'Model loading. Try again.';
                    $answerArea.val('❌ ' + msg);
                    updateStatus('idle','AI error');
                    showError('AI Error: ' + msg);
                    finishProcessing();
                });
                debugLog('=== sendToAI END (async launched) ===');
            }

            function finishProcessing() {
                isProcessingAI = false;
                $toggleBtn.prop('disabled', false);
                debugLog('Processing lock released.');
            }

            // ========== TEST AI (rename to Send) ==========
            $testAIBtn.on('click', function() {
                if (isProcessingAI) return;
                const currentQuestion = $transcriptionArea.val().trim();
                if (!currentQuestion) {
                    showAlert('Transcription is empty. Speak or type something first.');
                    return;
                }
                sendToAI(currentQuestion);
            });

            // ========== TEST PROXY (hidden) ==========
            $testProxyBtn.on('click', function() {
                debugLog('Testing proxy connectivity...');
                const testUrl = 'https://text.pollinations.ai/test?model=openai';
                (async () => {
                    for (const proxy of PROXY_LIST) {
                        const proxiedUrl = proxy.build(testUrl);
                        debugLog(`Testing ${proxy.name}: ${proxiedUrl}`);
                        try {
                            const resp = await fetch(proxiedUrl, { signal: AbortSignal.timeout(15000) });
                            debugLog(`Proxy ${proxy.name} status: ${resp.status}`);
                            if (resp.ok) {
                                const text = await resp.text();
                                debugLog(`Proxy ${proxy.name} works! Response: ${text.substring(0,100)}`);
                                showAlert(`Proxy ${proxy.name} is working!`);
                                return;
                            }
                        } catch (err) {
                            debugLog(`Proxy ${proxy.name} failed: ${err.message}`);
                        }
                    }
                    showAlert('All proxies failed. Check internet or use VPN.');
                })();
            });

            // ========== OPEN CORS DEMO PAGE ==========
            $openCorsDemoBtn.on('click', function() {
                window.open('https://cors-anywhere.herokuapp.com/corsdemo', '_blank');
            });

            // ========== EXPORT / IMPORT SETTINGS ==========
            $exportSettingsBtn.on('click', function() {
                const settings = {
                    apiProvider: $apiProvider.val(),
                    apiUrlInput: $apiUrlInput.val(),
                    apiToken: $apiToken.val(),
                    apiModel: $apiModel.val(),
                    promptKeyInput: $promptKeyInput.val(),
                    proxyToggle: $proxyToggle.is(':checked'),
                    languageSelect: $('#languageSelect').val(),
                    selectedLanguage: selectedLanguage
                };
                const blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sors.meet.config';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                debugLog('Settings exported.');
                showAlert('Settings exported to sors.meet.config');
            });

            $importSettingsBtn.on('click', function() {
                $('#importSettingsFile').trigger('click');
            });

            $importSettingsFile.on('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const settings = JSON.parse(ev.target.result);
                        if (settings.apiProvider) $apiProvider.val(settings.apiProvider);
                        if (settings.apiUrlInput) $apiUrlInput.val(settings.apiUrlInput);
                        if (settings.apiToken) $apiToken.val(settings.apiToken);
                        if (settings.apiModel) $apiModel.val(settings.apiModel);
                        if (settings.promptKeyInput) $promptKeyInput.val(settings.promptKeyInput);
                        if (settings.proxyToggle !== undefined) $proxyToggle.prop('checked', settings.proxyToggle);
                        if (settings.languageSelect) $('#languageSelect').val(settings.languageSelect);
                        if (settings.selectedLanguage) selectedLanguage = settings.selectedLanguage;
                        // Update provider fields
                        updateProviderFields();
                        // Update language badge
                        $('#currentLangBadge').text($('#languageSelect').val());
                        debugLog('Settings imported successfully.');
                        showAlert('Settings imported successfully.');
                    } catch (err) {
                        showError('Failed to parse config file: ' + err.message);
                    }
                };
                reader.readAsText(file);
                // Reset input
                $(this).val('');
            });

            // ========== CLEAR LOG ==========
            $clearLogBtn.on('click', function() {
                $('#debugConsole').html('');
                debugLog('Logs cleared.');
            });

            // ========== EVENTS ==========
            $toggleBtn.on('click', () => isRecording ? stopRecording(true) : startRecording());
            $('#languageSelect').on('change', function() { selectedLanguage=$(this).val(); $('#currentLangBadge').text(selectedLanguage); });
            $settingsToggleBtn.on('click', () => $settingsPanel.toggleClass('show'));
            $hideBtn.on('click', () => { 
                isHidden=true; 
                $appContainer.addClass('hidden-mode'); 
                $floatingRestoreBtn.addClass('active'); 
            });
            $floatingRestoreBtn.on('click', () => { 
                isHidden=false; 
                $appContainer.removeClass('hidden-mode'); 
                $floatingRestoreBtn.removeClass('active'); 
            });
            $clearAllBtn.on('click', () => { if(isRecording) stopRecording(false); $transcriptionArea.val(''); $answerArea.val(''); hideError(); updateStatus('idle','Ready'); });
            $copyTranscriptionBtn.on('click', () => copyToClipboard($transcriptionArea.val(), $(this)));
            $copyAnswerBtn.on('click', () => copyToClipboard($answerArea.val(), $(this)));
            function copyToClipboard(text, btn) {
                if(!text) return;
                navigator.clipboard.writeText(text).then(()=>{ const orig=btn.html(); btn.html('<i class="bi bi-check"></i> Copied!'); setTimeout(()=>btn.html(orig),1500); }).catch(()=>{});
            }
            $(document).on('keydown', e => { if(e.code==='Space' && !['input','textarea','select'].includes(e.target.tagName.toLowerCase())) { e.preventDefault(); $toggleBtn.trigger('click'); } });

            // Init
            if (!isSpeechSupported()) { showError('Browser not supported'); $toggleBtn.prop('disabled', true); }
            else { $('#micWarning').addClass('show'); }
            debugLog('App initialized');
        });
    </script>
</body>
</html>
